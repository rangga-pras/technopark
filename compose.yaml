services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Isi MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Isi MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Isi MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_DATABASE: technopark_test
      MYSQL_USER: technopark_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Isi MYSQL_TEST_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Isi MYSQL_TEST_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
